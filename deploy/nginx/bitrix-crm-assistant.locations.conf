# Shared proxy locations for Bitrix24 CRM Assistant.
# Install as /etc/nginx/snippets/bitrix-crm-assistant.locations.conf

client_max_body_size 4m;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

location ~ /\.env {
    deny all;
    return 404;
}
location ~* \.(sqlite|sqlite-wal|sqlite-shm)$ {
    deny all;
    return 404;
}
location ^~ /backups/ {
    deny all;
    return 404;
}

location = /auth/login {
    limit_req zone=crm_login burst=3 nodelay;
    proxy_pass http://bitrix_crm_assistant;
    include /etc/nginx/proxy_params;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

location ~ ^/(bitrix/event|communication-events/|webhooks/) {
    limit_req zone=crm_webhooks burst=10 nodelay;
    proxy_pass http://bitrix_crm_assistant;
    include /etc/nginx/proxy_params;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

location = /mcp {
    proxy_pass http://bitrix_crm_assistant;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
}

location / {
    proxy_pass http://bitrix_crm_assistant;
    include /etc/nginx/proxy_params;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_set_header Upgrade "";
}
