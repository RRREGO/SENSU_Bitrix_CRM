# Bitrix24 CRM Assistant — reverse proxy (HTTPS only, no WebSocket)
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled.

limit_req_zone $binary_remote_addr zone=crm_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=crm_webhooks:10m rate=30r/m;

upstream bitrix_crm_assistant {
    server 127.0.0.1:3005;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name goerp.pro www.goerp.pro;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goerp.pro www.goerp.pro;

    # ssl_certificate /etc/letsencrypt/live/goerp.pro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/goerp.pro/privkey.pem;

    client_max_body_size 4m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self';" always;

    # Deny sensitive paths
    location ~ /\.env {
        deny all;
        return 404;
    }
    location ~* \.(sqlite|sqlite-wal|sqlite-shm)$ {
        deny all;
        return 404;
    }
    location ^~ /backups/ {
        deny all;
        return 404;
    }

    location = /auth/login {
        limit_req zone=crm_login burst=3 nodelay;
        proxy_pass http://bitrix_crm_assistant;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location ~ ^/(bitrix/event|communication-events/|webhooks/) {
        limit_req zone=crm_webhooks burst=10 nodelay;
        proxy_pass http://bitrix_crm_assistant;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location / {
        proxy_pass http://bitrix_crm_assistant;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        # No WebSocket upgrade
        proxy_set_header Upgrade "";
    }
}
