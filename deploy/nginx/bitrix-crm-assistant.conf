# Bitrix24 CRM Assistant — reverse proxy (HTTPS only, no WebSocket)
#
# Install:
#   deploy/nginx/bitrix-crm-assistant.locations.conf -> /etc/nginx/snippets/
#   this file -> /etc/nginx/sites-available/ and symlink to sites-enabled
#
# Canonical host is https://agent.goerp.pro.
# goerp.pro and www.goerp.pro keep proxying the same app so existing POST
# webhooks keep working. Remove that server block after Wazzup and Bitrix
# are pointed at the subdomain.

limit_req_zone $binary_remote_addr zone=crm_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=crm_webhooks:10m rate=30r/m;

upstream bitrix_crm_assistant {
    server 127.0.0.1:3005;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.goerp.pro goerp.pro www.goerp.pro;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.goerp.pro;

    # ssl_certificate /etc/letsencrypt/live/agent.goerp.pro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agent.goerp.pro/privkey.pem;

    include snippets/bitrix-crm-assistant.locations.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name goerp.pro www.goerp.pro;

    # ssl_certificate /etc/letsencrypt/live/goerp.pro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/goerp.pro/privkey.pem;

    include snippets/bitrix-crm-assistant.locations.conf;
}
